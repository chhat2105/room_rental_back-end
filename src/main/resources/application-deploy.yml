spring.application.name=room-rental

# --- Database (PostgreSQL) ---
# Values default to local Postgres, but can be overridden by env vars (used in docker-compose)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:room_rental_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Server ---
server.port=8080

# --- JWT (used later by filters/services for auth) ---
app.jwt.secret=${JWT_SECRET:change-this-secret-key-to-something-long-and-random}
app.jwt.expiration-ms=86400000
