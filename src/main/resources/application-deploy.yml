server:
  port: ${PORT:8080}

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}
    username: ${postgres}
    password: ${MyChhat}

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

  otp:
    sms:
      expire: 10
      template: "This is one time security code. Don't tell anyone."
      enbaled: Y

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  upload:
    server:
      path: ${UPLOAD_PATH:/tmp/upload/images/}

post:
  free:
    app:
      jwtSecret: ${JWT_SECRET}
      jwtExpirationMs: 300000
      jwtRefreshExpirationMs: 86400000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    display-request-duration: true
    try-it-out-enabled: true
  api-docs:
    path: /v3/api-docs
  packages-to-scan: com.chhatkh.dev
  paths-to-match: /**