server:
  port: ${SERVER_PORT:8080}

file:
  upload-dir: ${UPLOAD_DIR:./uploads}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:room_rental_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

post:
  free:
    app:
      jwtSecret: ${JWT_SECRET:roomRentalSecretKeyMustBeLongEnoughForHMACSHA256Encryption2026}
      jwtExpirationMs: ${JWT_EXPIRATION_MS:86400000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
