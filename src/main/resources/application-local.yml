server:
  port: 9091

file:
  upload-dir: ./uploads

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:roomrental_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:MyChhat}

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true

  flyway:
    enabled: false

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

post:
  free:
    app:
      jwtSecret: ${JWT_SECRET:roomRentalSecretKeyMustBeLongEnoughForHMACSHA256Encryption2026}
      jwtExpirationMs: 86400000
      jwtRefreshExpirationMs: 604800000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    display-request-duration: true
    try-it-out-enabled: true
  api-docs:
    path: /v3/api-docs
  packages-to-scan: com.chhatkh.dev.controllers
  paths-to-match: /**
