version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: room-rental-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-room_rental_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d room_rental_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: room-rental-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-room_rental_db}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-7f3a9c1e5b8d2f460a6c9e1d4b7f2a850c3e6d9f1a4b7c0e3d6f9a2c5b8e1d4f}
      SERVER_PORT: 8080
    ports:
      - "8080:8080"

volumes:
  postgres_data:
